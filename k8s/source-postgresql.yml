apiVersion: v1
kind: Secret
metadata:
  name: source-postgresql-credentials
type: Opaque
stringData:
  POSTGRES_DB: debezium
  POSTGRES_USER: debezium
  POSTGRES_PASSWORD: debezium
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: source-postgresql
  labels:
    app: source-postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: source-postgresql
  template:
    metadata:
      labels:
        app: source-postgresql
    spec:
      containers:
        - name: postgresql
          image: quay.io/debezium/example-postgres:latest
          imagePullPolicy: IfNotPresent
          args:
            - "postgres"
            - "-c"
            - "wal_level=logical"
            - "-c"
            - "max_wal_senders=10"
            - "-c"
            - "max_replication_slots=10"
          envFrom:
            - secretRef:
                name: source-postgresql-credentials
          ports:
            - containerPort: 5432
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 30
            timeoutSeconds: 1
          readinessProbe:
            exec:
              command:
                - "/bin/sh"
                - "-i"
                - "-c"
                - "PGPASSWORD=${POSTGRES_PASSWORD} psql -w -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'SELECT 1'"
            initialDelaySeconds: 5
            timeoutSeconds: 1
      restartPolicy: Always
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: source-postgresql
spec:
  selector:
    app: source-postgresql
  ports:
    - name: db
      port: 5432
      targetPort: 5432
