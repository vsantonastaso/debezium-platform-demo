apiVersion: v1
kind: Secret
metadata:
  name: warehouse-postgresql-credentials
type: Opaque
stringData:
  POSTGRES_DB: warehouse
  POSTGRES_USER: warehouse
  POSTGRES_PASSWORD: warehouse
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: warehouse-postgresql
  labels:
    app: warehouse-postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: warehouse-postgresql
  template:
    metadata:
      labels:
        app: warehouse-postgresql
    spec:
      containers:
        - name: postgresql
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: warehouse-postgresql-credentials
          ports:
            - containerPort: 5432
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - "/bin/sh"
                - "-c"
                - "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
            initialDelaySeconds: 5
            timeoutSeconds: 1
      restartPolicy: Always
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: warehouse-postgresql
spec:
  selector:
    app: warehouse-postgresql
  ports:
    - name: db
      port: 5432
      targetPort: 5432
